<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Meta tags para vista previa en redes sociales -->
    <meta property="og:title" content="Bienvenidos a Pasillo Docente">
    <meta property="og:description" content="La comunidad definitiva para docentes de PBA. Descargá la app y accedé a ofertas y herramientas.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./img/logopasillo.jpg">
    
    <title>Bienvenidos - Pasillo Docente</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: #e3f2fd; 
            margin: 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh; 
            padding: 15px;
        }
        .card { 
            background: white; 
            padding: 25px 20px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            max-width: 380px; 
            width: 100%; 
            text-align: center;
        }
        .logo { 
            width: 75px; 
            height: 75px; 
            border-radius: 16px; 
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        h1 { 
            color: #1565C0; 
            margin: 0 0 8px 0; 
            font-size: 22px; 
        }
        p { 
            font-size: 14px; 
            color: #444; 
            line-height: 1.4; 
            margin: 0 0 15px 0; 
        }
        .banner { 
            width: 100%; 
            max-height: 150px; 
            object-fit: contain;
            border-radius: 8px; 
            margin-bottom: 15px;
            background: #f8f9fa;
        }
        .instruction {
            font-weight: bold;
            color: #1565C0;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .play-store-img {
            height: 55px;
            transition: transform 0.2s;
        }
        .play-store-img:active {
            transform: scale(0.95);
        }
        .footer { 
            margin-top: 15px; 
            font-size: 11px; 
            color: #777; 
            line-height: 1.3;
        }
        b { color: #1565C0; }
    </style>
</head>
<body>
    <div class="card">
        <img src="./img/logopasillo.jpg" alt="Logo Pasillo Docente" class="logo">
        <h1>¡Te damos la bienvenida!</h1>
        <p>Descubrí la forma más fácil de encontrar ofertas de trabajo docente en PBA.</p>
        
        <img src="./img/funciones.png" alt="Funciones de la App" class="banner">
        
        <p class="instruction">Instalá la app para empezar:</p>
        <a href="https://google.com">
            <img src="https://google.com" alt="Disponible en Google Play" class="play-store-img">
        </a>
        
        <div class="footer">
            Abrí la app en tu dispositivo para continuar.
        </div>
    </div>
</body>
</html>
